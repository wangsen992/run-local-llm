[build-system]
build-backend="hatchling.build"
requires=["hatchling"]

[project]
name="llm-local"
version="0.1.0"
requires-python=">=3.12"
dependencies=[
    "hydra-core==1.4.0rc3",
    "pytest",
    "jinja2==3.1.6"
  ]

[project.optional-dependencies]
agent = [
    "pi-agent-python-sdk==0.3.0",
]
server = [
    "vllm==0.33.0",
]
devel = ["python-lsp-server"]

